        complexity: 5
        rating: 3
        status: active
        tags:
          - 血缘
          - 元数据
          - 合规

  # ===== Checklist 检查清单 =====
  - component: checklist
    name: 检查清单
    description: 流程步骤检查与确认

    variants:
      - id: WF018
        name: 基础检查清单
        tagline: 步骤列表 + 勾选确认，操作标准化
        thumb:
          - /thumbs/WF018-1.svg
        pros:
          - 操作简单
          - 减少遗漏
          - 用户易理解
        cons:
          - 静态清单灵活性差
          - 不支持条件步骤
        useCases:
          - 上线检查清单
          - 设备巡检清单
          - 合规检查项
        antiCases:
          - 步骤数量超过 30 个
          - 需要条件分支
        related: [WF019, WF020]
        tech: Ant Design List + Checkbox + Progress
        complexity: 1
        rating: 5
        status: active
        tags:
          - 清单
          - 勾选
          - 标准化

      - id: WF019
        name: 条件检查清单
        tagline: 根据条件动态生成检查步骤
        thumb:
          - /thumbs/WF019-1.svg
        pros:
          - 按需展示步骤
          - 减少无关干扰
          - 适应多场景
        cons:
          - 实现复杂
          - 条件配置门槛高
        useCases:
          - 不同业务类型不同检查项
          - 根据金额触发不同审批
          - 按地区显示合规要求
        antiCases:
          - 所有场景步骤相同
          - 条件规则极少
        related: [WF018, WF020]
        tech: Ant Design List + 规则引擎 + 动态渲染
        complexity: 3
        rating: 4
        status: active
        tags:
