        tagline: 数据质量检查规则配置与监控
        thumb:
          - /thumbs/WF016-1.svg
        pros:
          - 质量问题早发现
          - 规则可复用
          - 监控面板直观
        cons:
          - 规则配置门槛高
          - 误报影响信任
        useCases:
          - 数据入库质量检查
          - 报表数据校验
          - 主数据治理
        antiCases:
          - 数据量极小
          - 不需要质量治理
        related: [WF015, WF017]
        tech: Ant Design Form + 规则引擎 + 监控面板
        complexity: 4
        rating: 4
        status: active
        tags:
          - 数据质量
          - 规则
          - 治理

      - id: WF017
        name: 数据血缘展示
        tagline: 数据上下游血缘关系可视化
        thumb:
          - /thumbs/WF017-1.svg
        pros:
          - 数据链路清晰
          - 变更影响易评估
          - 合规审计必备
