        complexity: 3
        rating: 4
        status: active
        tags:
          - Markdown
          - 开发者
          - 技术文档

      - id: IP020
        name: 邮件模板编辑器
        tagline: 变量插值 + 条件区块，专为邮件/短信模板设计
        thumb:
          - /thumbs/IP020-1.svg
        pros:
          - 原生支持模板变量语法高亮
          - 预览时自动替换样例数据
          - 条件块/循环块可视化
        cons:
          - 通用性差，仅限模板场景
          - 需与后端模板引擎对齐语法
