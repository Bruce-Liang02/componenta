        tagline: 表格/图片/视频/代码块全支持，类 Google Docs 体验
        thumb:
          - /thumbs/IP018-1.svg
        pros:
          - 功能全面，覆盖所有排版需求
          - 支持协同编辑扩展
          - 插件生态丰富
        cons:
          - 包体积较大
          - 定制成本高于轻量方案
          - 移动端体验受限
        useCases:
          - 知识库文章编辑
