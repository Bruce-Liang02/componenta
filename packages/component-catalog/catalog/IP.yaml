        tagline: 左侧 Markdown 源码 + 右侧实时预览，开发者友好
        thumb:
          - /thumbs/IP019-1.svg
        pros:
          - 开发者零学习成本
          - 输出纯 Markdown，版本可控
          - 支持代码高亮与数学公式
        cons:
          - 非技术用户上手难
          - 表格编辑不够直观
        useCases:
          - 技术文档编写
