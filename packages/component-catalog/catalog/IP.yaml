# catalog/IP.yaml
# 数据录入类组件形态

category: IP
categoryName: 数据录入
categoryNameEn: Input
description: 表单、选择器、上传、日期、富文本等数据录入类组件

components:
  # ===== Form 基础表单 =====
  - component: form
    name: 基础表单
    description: 数据录入的核心组件，B 端第二高频组件

    variants:
      - id: IP001
        name: 基础单列表单
        tagline: 单列布局，5 个以内字段，最朴素的表单形态
        thumb:
          - /thumbs/IP001-1.svg
        pros:
          - 用户最熟悉，学习成本为零
          - 实现简单，维护成本低
          - 移动端友好
        cons:
          - 字段多时页面过长
          - 不支持复杂逻辑
        useCases:
          - 字段数 3-5 个
          - 简单的信息录入场景
          - 登录、注册等基础表单
        antiCases:
          - 字段数超过 10 个
          - 需要分组展示
        related: [IP002, IP003]
        tech: Ant Design Form
        complexity: 1
        rating: 5
        status: active
        tags:
          - 简单
          - 基础
          - 移动端友好

      - id: IP002
        name: 分步表单
        tagline: 多步骤引导式填写，降低用户认知负担
        thumb:
          - /thumbs/IP002-1.svg
        pros:
          - 引导式体验，降低认知负担
          - 支持复杂表单的分步处理
          - 每步可独立校验
        cons:
          - 步骤多时用户可能失去耐心
          - 实现复杂度较高
        useCases:
          - 字段数 15 个以上
          - 需要分组引导的场景
          - 注册、开户等复杂流程
        antiCases:
          - 字段数少于 8 个
          - 不需要引导的简单表单
        related: [IP001, IP003]
        tech: Ant Design Steps + Form
        complexity: 3
        rating: 4
        status: active
        tags:
          - 分步
          - 引导式
          - 复杂表单

      - id: IP003
        name: 弹窗表单
        tagline: Modal 承载，不离开当前页面完成录入
        thumb:
          - /thumbs/IP003-1.svg
        pros:
          - 不离开当前页面，上下文不丢失
          - 适合轻量录入
          - 视觉聚焦
        cons:
          - 字段多时弹窗过大
          - 嵌套弹窗体验差
        useCases:
          - 快速新建/编辑
          - 字段数 5-10 个
          - 列表页内嵌操作
        antiCases:
          - 字段数超过 15 个
          - 需要多步骤引导
        related: [IP001, IP002]
        tech: Ant Design Modal + Form
        complexity: 2
        rating: 4
        status: active
        tags:
          - 弹窗
          - 轻量
          - 快速录入

      - id: IP004
        name: 抽屉表单
        tagline: Drawer 承载，侧滑录入，上下文可见
        thumb:
          - /thumbs/IP004-1.svg
        pros:
          - 侧滑展示，背景内容可见
          - 支持较多字段
          - 比弹窗更灵活
        cons:
          - 遮挡部分内容
          - 宽度受限
        useCases:
          - 字段数 8-20 个
          - 需要参考背景数据
          - 列表页侧边编辑
        antiCases:
          - 字段数超过 30 个
          - 移动端场景
        related: [IP003, IP005]
        tech: Ant Design Drawer + Form
        complexity: 2
        rating: 4
        status: active
        tags:
          - 抽屉
          - 侧滑
          - 中等复杂度

  # ===== Selector 选择器 =====
  - component: selector
    name: 选择器
    description: 下拉选择、级联、树形选择等

    variants:
      - id: IP005
        name: 基础下拉选择
        tagline: 最通用的单选/多选下拉
        thumb:
          - /thumbs/IP005-1.svg
        pros:
          - 用户最熟悉
          - 实现简单
          - 支持搜索
        cons:
          - 选项多时性能差
          - 不支持懒加载
        useCases:
          - 选项数 100 以内
          - 简单枚举选择
        antiCases:
          - 选项数超过 1000
          - 需要级联关系
        related: [IP006, IP007]
        tech: Ant Design Select
        complexity: 1
        rating: 5
        status: active
        tags:
          - 下拉
          - 基础

      - id: IP006
        name: 虚拟滚动选择器
        tagline: 万级选项流畅选择，前端零延迟
        thumb:
          - /thumbs/IP006-1.svg
        pros:
          - 支持超大量选项
          - 滚动流畅
          - 内存占用可控
        cons:
          - 实现复杂
          - 选项少时没必要
        useCases:
          - 选项数 1000 以上
          - 城市/商品等大数据集选择
        antiCases:
          - 选项数少于 100
        related: [IP005, IP007]
        tech: rc-virtual-list + Select
        complexity: 3
        rating: 4
        status: active
        tags:
          - 虚拟滚动
          - 大数据集

      - id: IP007
        name: 级联选择器
        tagline: 多级关联选择，如省市区
        thumb:
          - /thumbs/IP007-1.svg
        pros:
          - 多级关联直观
          - 支持懒加载
        cons:
          - 级数多时体验差
          - 数据结构复杂
        useCases:
          - 省市区选择
          - 品类/组织架构选择
        antiCases:
          - 无层级关系的数据
          - 级数超过 5 层
        related: [IP005, IP008]
        tech: Ant Design Cascader
        complexity: 2
        rating: 4
        status: active
        tags:
          - 级联
          - 多级选择

      - id: IP008
        name: 树形选择器
        tagline: 树形结构单选/多选，支持勾选
        thumb:
          - /thumbs/IP008-1.svg
        pros:
          - 树形结构清晰
          - 支持父子关联
          - 支持搜索
        cons:
          - 数据量大时性能差
          - 深层级展示困难
        useCases:
          - 组织架构选择
          - 权限树选择
          - 多级分类选择
        antiCases:
          - 扁平数据
          - 超过 1000 节点
        related: [IP007, IP005]
        tech: Ant Design TreeSelect
        complexity: 2
        rating: 4
        status: active
        tags:
          - 树形
          - 组织结构

  # ===== Upload 上传 =====
  - component: upload
    name: 文件上传
    description: 图片、文件、批量上传等

    variants:
      - id: IP009
        name: 基础文件上传
        tagline: 点击上传，支持拖拽，最通用的上传形态
        thumb:
          - /thumbs/IP009-1.svg
        pros:
          - 用户最熟悉
          - 支持拖拽
          - 实现简单
        cons:
          - 批量上传体验一般
          - 大文件上传需额外处理
        useCases:
          - 单文件/少量文件上传
          - 附件上传场景
        antiCases:
          - 批量上传数百个文件
          - 超大文件（GB 级）
        related: [IP010, IP011]
        tech: Ant Design Upload
        complexity: 1
        rating: 5
        status: active
        tags:
          - 拖拽
          - 基础

      - id: IP010
        name: 图片上传（裁剪）
        tagline: 图片选择 + 裁剪 + 预览，头像/封面场景
        thumb:
          - /thumbs/IP010-1.svg
        pros:
          - 自带裁剪能力
          - 实时预览
          - 适合头像场景
        cons:
          - 只适合图片
          - 裁剪比例受限
        useCases:
          - 头像上传
          - 封面图上传
          - 需要固定比例裁剪
        antiCases:
          - 非图片文件
          - 不需要裁剪的场景
        related: [IP009, IP011]
        tech: Ant Design Upload + react-cropper
        complexity: 3
        rating: 4
        status: active
        tags:
          - 图片
          - 裁剪
          - 头像

      - id: IP011
        name: 批量文件上传
        tagline: 文件列表管理，支持进度、重试、取消
        thumb:
          - /thumbs/IP011-1.svg
        pros:
          - 支持大量文件
          - 进度可视
          - 支持断点续传
        cons:
          - 实现复杂
          - 需要后端配合
        useCases:
          - 批量导入数据
          - 大文件上传
          - 需要进度反馈
        antiCases:
          - 单文件上传
          - 简单附件场景
        related: [IP009, IP010]
        tech: Ant Design Upload + tus-js-client
        complexity: 4
        rating: 4
        status: active
        tags:
          - 批量
          - 大文件
          - 断点续传

  # ===== Date Picker 日期选择 =====
  - component: date-picker
    name: 日期选择器
    description: 日期、时间、范围选择等

    variants:
      - id: IP012
        name: 基础日期选择
        tagline: 日历面板单选日期，B 端最常用的时间录入
        thumb:
          - /thumbs/IP012-1.svg
        pros:
          - 用户心智成熟，零学习成本
          - 日历面板直观
          - 支持格式自定义
        cons:
          - 不支持时间精度
          - 范围选择需额外组件
        useCases:
          - 生日、入职日期等单日选择
          - 报表日期筛选
          - 合同起止日期
        antiCases:
          - 需要精确到时分秒
          - 需要选择时间段
        related: [IP013, IP014]
        tech: Ant Design DatePicker
        complexity: 1
        rating: 5
        status: active
        tags:
          - 日期
          - 基础
          - 高频

      - id: IP013
        name: 日期范围选择
        tagline: 起止日期联动选择，一次操作完成区间录入
        thumb:
          - /thumbs/IP013-1.svg
        pros:
          - 起止联动，避免逻辑错误
          - 可视化区间范围
          - 支持快捷选项（近7天/近30天）
        cons:
          - 跨月选择体验稍差
          - 移动端面板偏窄
        useCases:
          - 报表时间范围筛选
          - 请假/出差日期区间
          - 活动有效期设置
        antiCases:
          - 只需单个日期
          - 日期跨度超过一年
        related: [IP012, IP014]
        tech: Ant Design DatePicker.RangePicker
        complexity: 2
        rating: 5
        status: active
        tags:
          - 范围
          - 日期区间
          - 高频

      - id: IP014
        name: 日期时间选择
        tagline: 日期 + 时分秒一体选择，精确到秒级
        thumb:
          - /thumbs/IP014-1.svg
        pros:
          - 日期时间一体，不用拆分两个字段
          - 支持 showTime 面板
          - 可控制精度到秒或毫秒
        cons:
          - 面板操作稍复杂
          - 用户需切换日期与时间面板
        useCases:
          - 会议/任务截止时间
          - 发布定时设置
          - 工单记录精确时间戳
        antiCases:
          - 只需日期不需时间
          - 对时间精度无要求
        related: [IP012, IP015]
        tech: Ant Design DatePicker showTime
        complexity: 2
        rating: 4
        status: active
        tags:
          - 日期时间
          - 精确时间

      - id: IP015
        name: 周/月/年选择器
        tagline: 按周、月、年粒度选择，适配报表与财务场景
        thumb:
          - /thumbs/IP015-1.svg
        pros:
          - 适配财务/报表周期
          - picker 属性一键切换粒度
          - 减少用户手动计算
        cons:
          - 周起始日需国际化处理
          - 自定义财年支持有限
        useCases:
          - 月报/周报/年报筛选
          - 财务账期选择
          - 绩效考核周期
        antiCases:
          - 需要精确到日
          - 非周期性时间选择
        related: [IP012, IP016]
        tech: Ant Design DatePicker picker=week/month/year
        complexity: 2
        rating: 4
        status: active
        tags:
          - 周月年
          - 报表周期

      - id: IP016
        name: 时间选择器
        tagline: 纯时分秒选择，配合日期组件使用
        thumb:
          - /thumbs/IP016-1.svg
        pros:
          - 滚轮式选择，操作高效
          - 可限定可选时段
          - 支持步长配置
        cons:
          - 单独使用场景有限
          - 时间跨度大时滚动费力
        useCases:
          - 每日打卡时间设置
          - 营业时间段选择
          - 定时任务执行时间
        antiCases:
          - 需要日期+时间一体
          - 不需要精确时间的场景
        related: [IP014, IP012]
        tech: Ant Design TimePicker
        complexity: 1
        rating: 4
        status: active
        tags:
          - 时间
          - 时分秒

  # ===== Rich Editor 富文本编辑器 =====
  - component: rich-editor
    name: 富文本编辑器
    description: 图文混排、内容编辑等

    variants:
      - id: IP017
        name: 轻量富文本
        tagline: 基础加粗/斜体/列表，满足公告与通知编辑
        thumb:
          - /thumbs/IP017-1.svg
        pros:
          - 体积小，加载快
          - API 简洁，集成成本低
          - 输出 HTML/Markdown 可切换
        cons:
          - 不支持表格/图片拖拽
          - 插件扩展有限
        useCases:
          - 系统公告编辑
          - 工单描述录入
          - 简单通知内容
        antiCases:
          - 需要复杂排版
          - 需要嵌入视频/表格
        related: [IP018, IP019]
        tech: TipTap StarterKit
        complexity: 2
        rating: 4
        status: active
        tags:
          - 轻量
          - 基础编辑

