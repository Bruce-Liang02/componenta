          - 互斥
          - 紧凑

      - id: IP031
        name: 三态开关
        tagline: 开/关/自动三态，适配需要默认跟随系统的场景
        thumb:
          - /thumbs/IP031-1.svg
        pros:
          - 支持"跟随系统"语义
          - 减少用户决策成本
          - 比两个开关更清晰
        cons:
          - 实现比二态复杂
