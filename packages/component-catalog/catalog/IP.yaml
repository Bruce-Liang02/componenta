  # ===== Number Input 数字输入 =====
  - component: number-input
    name: 数字输入
    description: 数值录入、步进器、金额输入等

    variants:
      - id: IP025
        name: 基础数字输入
        tagline: 带步进器的数值输入框，支持范围约束
        thumb:
          - /thumbs/IP025-1.svg
        pros:
          - 内置 +/- 步进器
          - 支持 min/max/step 约束
          - 键盘上下键可调节
        cons:
          - 大数值步进效率低
          - 不支持千分位展示
        useCases:
          - 数量录入（库存、订单数）
          - 百分比配置（0-100）
          - 评分/等级录入
        antiCases:
          - 需要输入非数字字符
          - 超大数值（百万级以上）
        related: [IP026, IP027]
        tech: Ant Design InputNumber
        complexity: 1
        rating: 5
        status: active
        tags:
          - 数字
          - 基础
          - 步进器

      - id: IP026
        name: 金额输入
        tagline: 千分位格式化 + 货币符号，专为金额录入设计
        thumb:
          - /thumbs/IP026-1.svg
        pros:
          - 自动千分位格式化
          - 支持多币种符号前缀
          - 精度可控（小数位数）
        cons:
          - 需处理精度丢失问题
          - 不同地区格式差异大
        useCases:
          - 合同金额录入
          - 报销金额填写
          - 商品价格设置
        antiCases:
          - 非金额类数值
          - 不需要格式化的纯计算数值
        related: [IP025, IP028]
        tech: Ant Design InputNumber + accounting.js
        complexity: 2
        rating: 4
        status: active
        tags:
          - 金额
          - 格式化
          - 货币

      - id: IP027
        name: 滑块数字输入
        tagline: 滑块 + 数值框联动，直观调节数值
        thumb:
          - /thumbs/IP027-1.svg
        pros:
          - 拖拽调节直观高效
          - 数值变化实时可视
          - 适合范围受限的参数
        cons:
          - 精确输入不如数字框
          - 大范围取值精度受限
        useCases:
          - 超时时间设置（秒）
          - 折扣比例调节
          - 音量/亮度等连续参数
        antiCases:
          - 需要精确到个位的大数值
          - 非连续型数值
        related: [IP025, IP033]
        tech: Ant Design Slider + InputNumber
        complexity: 2
        rating: 4
        status: active
        tags:
          - 滑块
          - 联动
          - 参数调节

      - id: IP028
        name: 百分比输入
        tagline: 0-100 百分比专用，自动在小数与百分比间转换
        thumb:
          - /thumbs/IP028-1.svg
        pros:
          - 内部存小数，展示为百分比
          - 自动限制 0-100 范围
          - 支持步进 0.1% 精度
        cons:
          - 场景过于垂直
          - 超过 100% 的占比不支持
        useCases:
          - 税率/折扣率设置
          - 完成进度录入
          - 概率/权重配置
        antiCases:
          - 百分比可超过 100%
          - 非百分比类数值
        related: [IP025, IP026]
        tech: Ant Design InputNumber + 自定义 formatter
        complexity: 1
        rating: 4
        status: active
        tags:
          - 百分比
          - 占比
          - 格式化

  # ===== Switch Toggle 开关切换 =====
  - component: switch-toggle
    name: 开关切换
    description: 布尔切换、状态开关等

    variants:
