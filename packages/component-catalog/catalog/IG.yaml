        complexity: 4
        rating: 3
        status: active
        tags:
          - 暗水印
          - 追溯
          - 隐蔽

      - id: IG025
        name: 文档水印嵌入
        tagline: 在导出的 PDF/图片中嵌入可见/不可见水印
        thumb:
          - /thumbs/IG025-1.svg
        pros:
          - 文件级别保护
          - 不依赖页面
          - 支持多种文件格式
        cons:
          - 需要服务端配合
          - 影响文件大小
        useCases:
