          - 统计
          - 群发

  # ===== WatermarkEmbed 水印 =====
  - component: watermark-embed
    name: 水印嵌入
    description: 页面水印生成与嵌入，防止信息泄露

    variants:
      - id: IG023
        name: 前端明水印
        tagline: CSS/Canvas 生成可见水印覆盖页面
        thumb:
          - /thumbs/IG023-1.svg
        pros:
          - 实现简单
          - 威慑效果好
          - 可自定义内容
        cons:
          - 可被前端移除
          - 影响页面美观
        useCases:
          - 内部管理后台
          - 敏感数据页面
          - 截图防泄露
        antiCases:
          - 高安全需求
          - 面向客户页面
        related: [IG024, IG025]
        tech: CSS background + Canvas 水印生成
        complexity: 1
        rating: 4
        status: active
        tags:
          - 明水印
          - 防截图
          - 安全

      - id: IG024
        name: 前端暗水印
        tagline: 不可见的隐形水印嵌入，泄露后可追溯
        thumb:
          - /thumbs/IG024-1.svg
        pros:
          - 不影响用户体验
          - 泄露可追溯
          - 难以被清除
        cons:
          - 需要专门工具提取
          - 信息承载有限
        useCases:
