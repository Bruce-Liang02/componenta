  # ===== UseDebounce 防抖节流 Hook =====
  - component: use-debounce
    name: 防抖节流 Hook
    description: 输入防抖、事件节流等性能优化

    variants:
      - id: AB018
        name: 基础 useDebounce
        tagline: 输入值防抖，延迟触发，减少高频请求
        thumb:
          - /thumbs/AB018-1.svg
        pros:
          - 减少无效请求
          - 提升性能
          - 实现简单
        cons:
          - 有延迟感知
          - 不适合实时场景
        useCases:
          - 搜索框输入
          - 表单实时校验
          - 筛选条件变化
        antiCases:
          - 需要实时响应
          - 按钮点击防重复
        related: [AB019, AB020]
        tech: 自定义 Hook + setTimeout / lodash.debounce
        complexity: 1
        rating: 5
        status: active
        tags:
          - 防抖
          - 输入
          - 性能

      - id: AB019
        name: 事件节流 useThrottle
        tagline: 高频事件节流，控制触发频率
        thumb:
          - /thumbs/AB019-1.svg
        pros:
          - 控制事件频率
          - 保护性能敏感操作
          - 滚动/resize 优化
        cons:
          - 丢失中间事件
          - 可能影响交互体验
        useCases:
          - 滚动事件监听
          - 窗口 resize
          - 拖拽位置更新
        antiCases:
          - 需要捕获所有事件
          - 点击类事件
        related: [AB018, AB020]
        tech: 自定义 Hook + requestAnimationFrame / lodash.throttle
        complexity: 1
        rating: 4
        status: active
        tags:
          - 节流
          - 事件
          - 频率

      - id: AB020
        name: 异步防抖 useDebounceFn
        tagline: 函数级防抖，支持异步操作与取消
        thumb:
          - /thumbs/AB020-1.svg
        pros:
          - 支持异步函数
          - 可取消待执行
          - 支持 leading/trailing 模式
        cons:
          - API 较复杂
          - 需要理解防抖概念
        useCases:
          - 按钮提交防重复
          - 异步搜索请求
          - 数据自动保存
        antiCases:
          - 简单同步操作
          - 不需要防抖
        related: [AB018, AB019]
        tech: 自定义 Hook + Promise + cancelable
        complexity: 2
        rating: 4
        status: active
        tags:
          - 异步
          - 函数
          - 取消
