          - 平级内容切换
        antiCases:
          - 标签超过 10 个
          - 需要动态增删标签
        related: [NV005, NV006]
        tech: Ant Design Tabs
        complexity: 1
        rating: 5
        status: active
        tags:
          - 卡片式
          - 基础

      - id: NV005
        name: 可关闭标签页
        tagline: 支持动态增删，类似浏览器标签
        thumb:
          - /thumbs/NV005-1.svg
        pros:
          - 支持动态增删
          - 用户可自定义
          - 适合多任务
        cons:
          - 实现复杂
          - 需要管理标签状态
        useCases:
          - 多页面编辑
          - 工单/任务切换
          - IDE 风格系统
        antiCases:
          - 固定标签内容
          - 简单切换场景
        related: [NV004, NV006]
        tech: Ant Design Tabs (editable)
        complexity: 3
        rating: 4
        status: active
        tags:
          - 可关闭
          - 动态
          - 多任务

      - id: NV006
        name: 步骤标签页
        tagline: 带步骤编号的标签，适合流程引导
        thumb:
          - /thumbs/NV006-1.svg
        pros:
          - 流程引导清晰
          - 支持状态标记
          - 视觉效果好
        cons:
          - 不适合无序切换
          - 步骤多时占空间
        useCases:
          - 分步表单
          - 流程审批
          - 向导式操作
        antiCases:
          - 无顺序的内容
          - 标签超过 8 个
        related: [NV004, NV005]
        tech: Ant Design Steps + Tabs
        complexity: 2
        rating: 4
        status: active
        tags:
          - 步骤
          - 流程
          - 引导

