# catalog/NV.yaml
# 导航与布局类组件形态

category: NV
categoryName: 导航与布局
categoryNameEn: Navigation
description: 菜单、标签页、面包屑、布局容器等导航类组件

components:
  # ===== Menu 菜单 =====
  - component: menu
    name: 导航菜单
    description: 系统级导航菜单

    variants:
      - id: NV001
        name: 侧边栏菜单
        tagline: 左侧固定菜单，B 端最经典的导航形态
        thumb:
          - /thumbs/NV001-1.svg
        pros:
          - 用户最熟悉
          - 支持多级展开
          - 可折叠节省空间
        cons:
          - 菜单项多时查找困难
          - 占用横向空间
        useCases:
          - 一级菜单 5-10 个
          - 需要多级子菜单
          - PC 端管理系统
        antiCases:
          - 一级菜单超过 15 个
          - 移动端场景
        related: [NV002, NV003]
        tech: Ant Design Menu (vertical)
        complexity: 2
        rating: 5
        status: active
        tags:
          - 侧边栏
          - 多级
          - 可折叠

      - id: NV002
        name: 顶部导航菜单
        tagline: 顶部水平菜单，简洁现代
        thumb:
          - /thumbs/NV002-1.svg
        pros:
          - 视觉简洁
          - 不占横向空间
          - 适合扁平结构
        cons:
          - 菜单项多时放不下
          - 不支持多级展开
        useCases:
          - 一级菜单 3-7 个
          - 扁平化导航结构
          - 门户/官网
        antiCases:
          - 菜单项超过 10 个
          - 需要多级子菜单
        related: [NV001, NV003]
        tech: Ant Design Menu (horizontal)
        complexity: 1
        rating: 4
        status: active
        tags:
          - 顶部
          - 水平
          - 简洁

      - id: NV003
        name: 混合导航菜单
        tagline: 顶部一级 + 侧边二级，大型系统首选
        thumb:
          - /thumbs/NV003-1.svg
        pros:
          - 支持大量菜单项
          - 层次清晰
          - 大型系统友好
        cons:
          - 实现复杂
          - 占用空间较大
        useCases:
          - 一级菜单 5-15 个
          - 每个一级下有 3-10 个二级
          - 大型企业管理系统
        antiCases:
          - 菜单项少于 10 个
          - 简单的系统
        related: [NV001, NV002]
        tech: Ant Design Menu + Layout
        complexity: 3
        rating: 4
        status: active
        tags:
          - 混合
          - 大型系统
          - 多级

  # ===== Tabs 标签页 =====
  - component: tabs
    name: 标签页
